<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Page Not Found | Ghost WhatsApp Autopilot</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#E0E5EC" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3" />
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 300;
      font-display: swap;
      src: url('/assets/fonts/inter-latin-300-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/assets/fonts/inter-latin-400-normal.woff2') format('woff2');
    }
    :root {
      --bg-base: #E0E5EC;
      --text-primary: #3D4852;
      --text-secondary: #556070;
      --accent-color: #5FB3B3;
      --shadow-raised: 9px 9px 16px #A3B1C6, -9px -9px 16px #FFFFFF;
      --shadow-raised-sm: 5px 5px 10px #A3B1C6, -5px -5px 10px #FFFFFF;
      --shadow-inset-sm: inset 4px 4px 8px #A3B1C6, inset -4px -4px 8px #FFFFFF;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      padding: 44px 32px;
      border-radius: 32px;
      background-color: var(--bg-base);
      box-shadow: var(--shadow-raised);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }
    .logo-well {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--bg-base);
      box-shadow: var(--shadow-inset-sm);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-well img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    p {
      font-size: 0.875rem;
      font-weight: 300;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .home-link {
      margin-top: 6px;
      padding: 12px 24px;
      border-radius: 999px;
      background-color: var(--bg-base);
      box-shadow: var(--shadow-raised-sm);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      transition: all 0.2s ease;
    }
    .home-link:hover,
    .home-link:active {
      box-shadow: var(--shadow-inset-sm);
      color: var(--accent-color);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-well">
      <picture>
        <source srcset="/assets/pigeon-white-nobg.webp" type="image/webp" />
        <img src="/assets/pigeon-white-nobg.png" alt="Ghost White Pigeon Logo" width="64" height="64" />
      </picture>
    </div>
    <h1>404 · Route Not Found</h1>
    <p>This page doesn't exist. Return to the Ghost WhatsApp Autopilot dashboard.</p>
    <a class="home-link" href="/">Back to Ghost Autopilot</a>
  </main>
</body>
</html>
